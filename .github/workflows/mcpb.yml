name: Build release assets (MCPB bundle)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to attach the bundle to (leave empty to only build)
        required: false

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # One universal bundle: node:sqlite is built into Node and the dependencies are pure JS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch builds the source of the tag it will attach to, not the dispatching branch.
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package version matches the release tag
        shell: bash
        env:
          # Set on a tag push or when release_tag is given; empty for a build-only dispatch.
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
        run: |
          if [ -n "$TAG" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            if [ "$VERSION" != "${TAG#v}" ]; then
              echo "::error::package.json version $VERSION does not match tag $TAG"
              exit 1
            fi
          fi
      - run: npm ci
      - run: npm run build:mcpb
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-mcpb/*.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/*.mcpb
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist-mcpb/*.mcpb --clobber

